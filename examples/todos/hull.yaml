# $schema: ../../packages/blueprint/schema/v0/hull.json
# yaml-language-server: $schema=../../packages/blueprint/schema/v0/hull.json

name: todos
provider: aws
region: us-east-1

usage:
  # usage profile, low-end defaults from `hull init`
  requestsPerMonth: 100000
  storageGb: 1
  messagesPerMonth: 100000

intents:
  api:
    kind: http-api
    resolution: lambda-api-gateway
    entry: src/api/index.ts
    links:
      - to: db
        role: read-write
      - to: jobs
        role: produce

  jobs:
    kind: queue
    resolution: sqs-standard

  worker:
    kind: background-worker
    resolution: lambda-worker
    entry: src/worker/index.ts
    links:
      - to: jobs
        role: consume
      - to: db
        role: read-write

  db:
    kind: relational-database
    resolution: rds-postgres

environments:
  dev: {}
  prod:
    usage:
      requestsPerMonth: 2000000
      messagesPerMonth: 2000000
    overrides:
      db:
        instanceClass: db.t4g.small
      worker:
        maxConcurrency: 10
